##
## MUNI edge — HTTPS / production.
##
## Activate by setting NGINX_CONF=nginx.ssl.conf in .env. Requires a certificate
## to already exist at the ssl_certificate paths below — nginx exits at startup
## if it is missing, which is why this is not the default. Run `npm run tls:init`
## once to obtain one, then deploy.
##
## CHANGING DOMAIN: three places below are domain-specific and must all match
## the certificate — the two server_name lines and the ssl_certificate paths.
##
## Also set COOKIE_SECURE=true in .env when using this config, or the shared
## refreshToken cookie stays non-Secure on an HTTPS origin.
##

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 25m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    include /etc/nginx/includes/upstreams.conf;

    # ── :80 — ACME + redirect only ────────────────────────────────────────────
    # Serves no application content. The challenge location stays reachable over
    # plain HTTP because that is how certbot renews.
    server {
        listen 80;
        server_name muni.ug www.muni.ug;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            return 301 https://muni.ug$request_uri;
        }
    }

    # ── :443 — canonicalise www → apex ────────────────────────────────────────
    # Not cosmetic. Cookies set on muni.ug are not sent to www.muni.ug, so a
    # user who reached the seller portal via www would silently fail the shared
    # session and be asked to log in again. One canonical origin avoids that.
    # Needs the certificate to cover www as well, which tls:init requests.
    server {
        listen 443 ssl;
        http2 on;
        server_name www.muni.ug;

        ssl_certificate     /etc/letsencrypt/live/muni.ug/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/muni.ug/privkey.pem;
        include /etc/nginx/includes/tls.conf;

        return 301 https://muni.ug$request_uri;
    }

    # ── :443 — the application ────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name muni.ug;

        ssl_certificate     /etc/letsencrypt/live/muni.ug/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/muni.ug/privkey.pem;
        include /etc/nginx/includes/tls.conf;

        # HSTS lives only on the TLS server. Browsers ignore it over plain HTTP,
        # and it is intentionally absent from nginx.conf so a local HTTP deploy
        # cannot pin your browser into HTTPS-only for localhost.
        # `preload` is omitted on purpose — submitting to the preload list is
        # effectively irreversible; add it deliberately, not by default.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        include /etc/nginx/includes/server-common.conf;
    }
}
