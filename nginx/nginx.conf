##
## MUNI edge — PLAIN HTTP (default).
##
## This is the config mounted when NGINX_CONF is unset, so `npm run deploy`
## works on a fresh machine with no certificates present. For real HTTPS on
## muni.ug, obtain certs and set NGINX_CONF=nginx.ssl.conf — see
## nginx/nginx.ssl.conf and `npm run tls:init`.
##
## The two configs share nginx/includes/* so their routing cannot drift apart.
##

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 25m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    include /etc/nginx/includes/upstreams.conf;

    server {
        listen 80;
        # Catch-all: serves the deployment under whatever hostname it is reached
        # by (localhost for a local `docker compose up`, or a real domain), so
        # this file works in both places without edits. The TLS config pins an
        # explicit server_name instead, because there the certificate does too.
        server_name _;

        # ACME http-01 challenge. Present even in HTTP-only mode so certificates
        # can be issued against this running deployment *before* switching to
        # nginx.ssl.conf — the cert has to exist first or nginx refuses to start.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        include /etc/nginx/includes/server-common.conf;
    }
}
