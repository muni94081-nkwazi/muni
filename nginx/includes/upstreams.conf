# Shared by nginx.conf (HTTP) and nginx.ssl.conf (HTTPS). Included at http level.
#
# Upstreams are compose service names on the muni-network bridge, resolved by
# Docker's embedded DNS. Pointing these at localhost would resolve to the nginx
# container itself.
#
# Note: nginx resolves these hostnames once, when it parses the config, and
# exits if any of them fails to resolve. That is why the nginx service in
# docker-compose.yml declares depends_on for every upstream below.

upstream customer_web  { server customer-web:80;  }
upstream seller_center { server seller-center:80; }
upstream admin_panel   { server admin-panel:80;   }
upstream api_gateway   { server api-gateway:8080; }
upstream chat_service  { server chat-service:4025; }
