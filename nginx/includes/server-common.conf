# Everything that goes *inside* a server block, shared by the HTTP config
# (nginx.conf) and the HTTPS config (nginx.ssl.conf) so the two cannot drift.
# Included from within `server { ... }` — do not include this at http level.
#
# HSTS is deliberately NOT here: it belongs only on the TLS server, and is
# added inline in nginx.ssl.conf.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ── Content-Security-Policy ───────────────────────────────────────────────────
#
# The gateway sets its own CSP via helmet, but that only covers responses the
# gateway produces — JSON from /api/. The HTML documents are served by the SPA
# containers, so until this line every page in all three apps shipped with no
# CSP at all.
#
# Declared here at server level, alongside the other security headers, rather
# than inside the SPA location blocks. nginx's add_header does NOT merge: a
# single add_header inside `location /` would drop every header inherited from
# this scope, so scoping the CSP would silently un-set the four above.
#
# Each directive below is load-bearing; the deviations from a textbook policy
# are what the app actually needs to run:
#
#   script-src 'self'
#       No 'unsafe-inline'. Vite emits a single external module script and the
#       built HTML carries no inline <script>. The one inline handler that did
#       exist — the web-font media swap in index.html — moved into main.tsx
#       precisely so this directive could stay clean.
#
#   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com
#       'unsafe-inline' is required and not yet removable: the auth screens and
#       several pages style elements with inline `style` attributes, which CSP
#       treats as inline style. Removing it is a real refactor (move AuthUI.tsx
#       and friends onto CSS modules), not a config change. The Google Fonts
#       origin serves the @font-face stylesheet index.html requests.
#
#   font-src 'self' https://fonts.gstatic.com
#       googleapis.com serves the CSS; gstatic.com serves the actual font
#       files. Allowing only the first fetches a stylesheet whose every
#       @font-face then fails.
#
#   img-src 'self' https: data: blob:
#       data: and blob: are not optional here. utils/imageFallback.ts inlines an
#       SVG placeholder as a data: URI, imageOptimization.ts probes AVIF/WebP
#       support with data: images, and OptimizedImage passes blob: URLs through
#       for locally-previewed uploads. `https:` covers the remote product
#       imagery (placehold.co, images.unsplash.com).
#
#   connect-src 'self'
#       Everything the browser talks to is same-origin behind this edge: /api/
#       to the gateway and /chat/ for the Socket.io upgrade. 'self' covers the
#       ws:/wss: upgrade to the same origin in every current browser. If the API
#       is ever split onto its own origin, add it here — a missing entry shows
#       up as every request failing, not as a subtle bug.
#
#   frame-ancestors 'none'
#       The modern replacement for X-Frame-Options, kept above for old browsers.
#
#   base-uri 'self' / form-action 'self'
#       Cheap and worth having: they stop an injected <base> from re-pointing
#       every relative URL, and stop a form from posting credentials off-origin.
#       Neither restricts the OAuth flow, which leaves via a top-level
#       navigation the server issues, not a form post.
#
#   object-src 'none'
#       No Flash/Java/PDF plugin surface. Nothing here embeds one.
#
# If this needs loosening, prefer adding one origin to one directive over
# reaching for 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https: data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# Forwarded headers are load-bearing: the gateway sets `trust proxy` and
# derives req.ip from X-Forwarded-For for its per-IP rate-limit buckets.
# X-Forwarded-Proto is what lets the backend know the original request was
# HTTPS even though this hop to the container is plain HTTP.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;

# ── API ───────────────────────────────────────────────────────────────────────
# No trailing slash on proxy_pass, deliberately. With one ("http://api_gateway/")
# nginx REPLACES the matched /api/ prefix, so /api/v1/products arrives as
# /v1/products — but the gateway mounts its routers at /api/v1 and would
# 404 every call. Without it the full original path is forwarded intact.
location /api/ {
    proxy_pass http://api_gateway;
    proxy_read_timeout 60s;

    # The gateway sets its own CSP via helmet. Left alone, a proxied response
    # would carry two CSP headers and the browser would enforce the
    # intersection of both — harmless for JSON today, but a trap the first time
    # the two policies disagree and the symptom is a blocked resource with no
    # obvious owner. One policy, set at this edge, is easier to reason about.
    proxy_hide_header Content-Security-Policy;
}

# ── Socket.io (chat) ──────────────────────────────────────────────────────────
# Direct to chat-service: the gateway's HTTP proxy cannot carry a websocket
# upgrade. Same-origin here, so no CORS and the auth cookie rides along.
location /chat/ {
    proxy_pass http://chat_service/;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

# ── Seller Center SPA ─────────────────────────────────────────────────────────
# Trailing slash on proxy_pass — the opposite of /api/ above — so nginx strips
# the /seller/ prefix before forwarding.
#
# The two halves have to agree. Vite builds with base=/seller/, so index.html
# asks the browser for /seller/assets/index-<hash>.js; but the Dockerfile copies
# dist/ to the html root, so the file actually sits at /assets/index-<hash>.js.
# Stripping here reconciles them. Forwarding the path intact instead makes every
# asset miss and fall through the SPA's try_files to index.html, so the browser
# receives HTML where it expected a module and the app renders a blank page.
#
# Its container healthcheck (GET /) still passes in that state, because / is
# exactly the one path that is supposed to return index.html — which is why this
# has to be verified by fetching an asset, not by container health.
location /seller/ {
    proxy_pass http://seller_center/;
}

# ── Admin Panel SPA ───────────────────────────────────────────────────────────
# Same prefix-stripping contract as /seller/ above (vite base=/admin/).
location /admin/ {
    proxy_pass http://admin_panel/;
}

# Bare /seller and /admin (no trailing slash) would otherwise fall through to
# customer-web's catch-all and render its 404 page.
#
# absolute_redirect off makes the Location header relative ("/seller/") instead
# of nginx reconstructing "scheme://$host/seller/". The reconstruction guesses
# the scheme and port from this listener, so behind a TLS-terminating load
# balancer it can emit an http:// URL for an https:// request, downgrading the
# user and dropping any non-default port. A relative Location cannot be wrong.
absolute_redirect off;
location = /seller { return 301 /seller/; }
location = /admin  { return 301 /admin/;  }

# ── Customer Web SPA (catch-all) ──────────────────────────────────────────────
location / {
    proxy_pass http://customer_web;
}
