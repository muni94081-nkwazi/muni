# TLS parameters, shared by every ssl server block in nginx.ssl.conf.
# Included from within `server { ... }`, after ssl_certificate.
#
# TLS 1.2 is kept alongside 1.3: a meaningful share of traffic in Uganda comes
# from older Android devices whose system TLS stack has no 1.3 support, and
# dropping it would lock them out entirely.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache shared:MUNI_TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling. chain.pem is issued by certbot alongside the cert; the resolver
# is Docker's embedded DNS, which nginx needs in order to reach the OCSP
# responder by hostname at runtime.
ssl_stapling on;
ssl_stapling_verify on;
ssl_trusted_certificate /etc/letsencrypt/live/muni.ug/chain.pem;
resolver 127.0.0.11 valid=30s;
resolver_timeout 5s;
