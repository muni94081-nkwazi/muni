# ─── Debug override: publish every service port on the host ───────────────────
#
# The base docker-compose.yml deliberately publishes NO service ports. Inside
# the compose network the services reach each other by name, and the only way
# in from outside is the nginx edge — which is what makes the gateway's
# stripClientIdentity, requireAuth/requireRole and Redis rate limiting an actual
# boundary rather than a suggestion. With 4001-4033 bound to 0.0.0.0 anyone who
# can reach the host talks straight to a service and skips all three.
#
# This file puts them back, for the times that is genuinely useful: attaching a
# debugger, curling one service in isolation, or pointing a REST client at a
# single upstream.
#
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml --profile services up -d
#
# Never use it on a host that is reachable from anywhere but your own machine.
#
# Generated from the port assignments that used to live in docker-compose.yml;
# keep it in step when a service's PORT changes.

services:
  auth-service:
    ports: ["4001:4001"]
  user-service:
    ports: ["3001:3001"]
  product-service:
    ports: ["4002:4002"]
  inventory-service:
    ports: ["4004:4004"]
