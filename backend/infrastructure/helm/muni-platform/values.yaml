global:
  registry: 123456789012.dkr.ecr.af-south-1.amazonaws.com/muni
  imageTag: 1.0.0
  imagePullPolicy: IfNotPresent
  nameOverride: ""

ingress:
  enabled: true
  className: nginx
  host: api.muni.ug
  tls:
    enabled: true
  annotations: {}

serviceAccount:
  create: true
  name: ""

configmap:
  NODE_ENV: "production"
  LOG_LEVEL: "info"

secrets:
  JWT_SECRET: "placeholder"
  DB_PASSWORD: "placeholder"
  STRIPE_KEY: "placeholder"
  PAYPAL_KEY: "placeholder"

kafka:
  brokers: "kafka:9092"

redis:
  url: "redis://redis:6379"

elasticsearch:
  url: "http://elasticsearch:9200"

postgresql:
  host: "postgresql"
  port: "5432"
  database: "muni"
  user: "postgres"

nodeSelector: {}
tolerations: []
affinity: {}

services:
  api-gateway:
    enabled: true
    replicaCount: 2
    image:
      repository: api-gateway
      tag: ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
    service:
      port: 8080
    env: {}

  auth-service:
    enabled: true
    replicaCount: 2
    image:
      repository: auth-service
      tag: ""
    resources:
      requests:
        cpu: 100m
