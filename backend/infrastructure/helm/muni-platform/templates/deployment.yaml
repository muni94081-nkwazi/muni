{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "muni.labels" $ | nindent 4 }}
    app: {{ $name }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ $name }}
        {{- include "muni.selectorLabels" $ | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: {{ include "muni.serviceAccountName" $ }}
      containers:
      - name: {{ $name }}
        image: "{{ $.Values.global.registry }}/{{ $name }}:{{ $svc.image.tag | default $.Values.global.imageTag }}"
        imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ $svc.service.port }}
          name: http
        envFrom:
        - configMapRef:
            name: {{ include "muni.fullname" $ }}-config
        - secretRef:
            name: {{ include "muni.fullname" $ }}-secrets
        env:
        - name: PORT
          value: "{{ $svc.service.port }}"
        {{- range $k, $v := $svc.env }}
        - name: {{ $k }}
          value: "{{ $v }}"
        {{- end }}
        resources:
          {{- toYaml $svc.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health/live
            port: {{ $svc.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: {{ $svc.service.port }}
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - {{ $name }}
              topologyKey: kubernetes.io/hostname
---
{{- end }}
{{- end }}
