{{- $criticalServices := list "api-gateway" "auth-service" "order-service" "payment-service" "checkout-service" }}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (has $name $criticalServices) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "muni.labels" $ | nindent 4 }}
    app: {{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ $name }}
---
{{- end }}
{{- end }}
