{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "muni.labels" $ | nindent 4 }}
    app: {{ $name }}
spec:
  type: {{ if eq $name "api-gateway" }}LoadBalancer{{ else }}ClusterIP{{ end }}
  ports:
    - port: {{ $svc.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ $name }}
---
{{- end }}
{{- end }}
