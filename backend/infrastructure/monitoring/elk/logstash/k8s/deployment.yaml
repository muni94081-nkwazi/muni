apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: muni-monitoring
  labels:
    app: logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
      - name: logstash
        image: docker.elastic.co/logstash/logstash:8.13.4
        ports:
        - containerPort: 5044
          name: beats
        env:
        - name: ELASTICSEARCH_URL
          value: "http://elasticsearch.muni:9200"
        - name: LS_JAVA_OPTS
          value: "-Xmx1g -Xms1g"
        volumeMounts:
        - name: pipeline-volume
          mountPath: /usr/share/logstash/pipeline/
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
      volumes:
      - name: pipeline-volume
        configMap:
          name: logstash-pipeline
