apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: muni-monitoring
data:
  filebeat.yml: |
    filebeat.inputs:
    - type: container
      paths:
        - /var/log/containers/*.log
      processors:
      - add_kubernetes_metadata:
          host: $
          matchers:
          - logs_path:
              logs_path: "/var/log/containers/"
      # Only collect logs from muni namespace
      fields:
        log_type: muni
      fields_under_root: true

    processors:
    - drop_fields:
        when:
          not:
            has_fields: ['kubernetes.namespace']
        fields: []
    - drop_event:
        when:
          not:
            regexp:
              kubernetes.namespace: "^muni"

    output.logstash:
      hosts: ["logstash.muni-monitoring:5044"]
      bulk_max_size: 2048
      timeout: 30

    monitoring.enabled: false
    logging.level: warning
