apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana
  namespace: muni-monitoring
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - kibana.muni.ug
    secretName: kibana-tls
  rules:
  - host: kibana.muni.ug
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kibana
            port:
              number: 5601
