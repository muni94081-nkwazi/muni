apiVersion: 1
datasources:
- name: Prometheus
  type: prometheus
  uid: prometheus
  url: http://prometheus.muni-monitoring:9090
  isDefault: true
  editable: false
  jsonData:
    timeInterval: 15s
    queryTimeout: 60s
    httpMethod: POST

- name: Loki
  type: loki
  uid: loki
  url: http://loki.muni-monitoring:3100
  editable: false
  jsonData:
    maxLines: 1000
    derivedFields:
    - datasourceUid: jaeger
      matcherRegex: '"correlationId":"([^"]+)"'
      name: correlationId
      url: '${__value.raw}'

- name: Jaeger
  type: jaeger
  uid: jaeger
  url: http://jaeger-query.muni-monitoring:16686
  editable: false

- name: Elasticsearch
  type: elasticsearch
  uid: elasticsearch
  url: http://elasticsearch.muni:9200
  editable: false
  jsonData:
    index: muni-logs-*
    timeField: "@timestamp"
    esVersion: "8.0.0"
    logMessageField: message
    logLevelField: level
