apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: muni-ingress
  namespace: muni
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway-svc
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: customer-web-svc
            port:
              number: 80
