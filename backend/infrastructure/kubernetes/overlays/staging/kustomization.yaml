apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: staging-
namespace: muni-staging
bases:
- ../../base
patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    labelSelector: tier=backend
configMapGenerator:
- name: muni-config
  behavior: merge
  literals:
  - NODE_ENV=staging
  - LOG_LEVEL=info
  - KAFKA_BROKERS=kafka.muni-staging.svc.cluster.local:9092
