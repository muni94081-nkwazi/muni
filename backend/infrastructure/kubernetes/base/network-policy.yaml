apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: muni
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-api-gateway
  namespace: muni
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway-to-services
  namespace: muni
spec:
  podSelector:
    matchLabels:
      tier: backend
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-infra
  namespace: muni
spec:
  podSelector:
    matchLabels:
      tier: backend
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    - podSelector:
        matchLabels:
          app: redis
    - podSelector:
        matchLabels:
          app: elasticsearch
    - podSelector:
        matchLabels:
          app: postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-notification-service-ingress
  namespace: muni
spec:
  podSelector:
    matchLabels:
      app: notification-service
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: backend
