---
# KEDA ScaledObjects — Kafka-driven autoscaling for event-heavy services
# KEDA watches Kafka consumer group lag and scales pods up/down automatically.
# Install KEDA: helm install keda kedacore/keda --namespace keda --create-namespace

# ── Order Service — scales on order-events lag ────────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: order-service-scaler
  namespace: muni
spec:
  scaleTargetRef:
    name: order-service
  pollingInterval: 15
  cooldownPeriod: 60
  minReplicaCount: 2
  maxReplicaCount: 20
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: kafka.muni.svc.cluster.local:9092
      consumerGroup: order-service-group
      topic: order-events
      lagThreshold: "50"
      offsetResetPolicy: latest
---
