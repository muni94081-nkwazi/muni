---
# ── API Gateway — scales on Redis rate-limiter request queue ──────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: api-gateway-scaler
  namespace: muni
spec:
  scaleTargetRef:
    name: api-gateway
  pollingInterval: 10
  cooldownPeriod: 30
  minReplicaCount: 3
  maxReplicaCount: 30
  triggers:
  - type: redis
    metadata:
      address: redis.muni.svc.cluster.local:6379
      listName: gateway:request-queue
      listLength: "100"
