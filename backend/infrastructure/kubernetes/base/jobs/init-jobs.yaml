---
# ── Kafka Topic Initialization Job ───────────────────────────────────────────
# Runs once on cluster setup to create all 25 required topics with proper
# replication factors and partition counts.
# Run: kubectl apply -f jobs/kafka-init.yaml -n muni

apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: muni
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        job: kafka-topic-init
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-kafka
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z kafka 9092; do
            echo "Waiting for Kafka..."; sleep 5
          done
          echo "Kafka is ready!"
      containers:
      - name: kafka-topic-creator
        image: confluentinc/cp-kafka:7.6.0
        command:
        - sh
        - -c
        - |
          BOOTSTRAP=kafka:9092
          PARTITIONS=3
          REPLICATION=3

          create_topic() {
            local topic=$1
            local partitions=${2:-$PARTITIONS}
            local retention_ms=${3:-604800000}  # 7 days default
            echo "Creating topic: $topic (partitions=$partitions, retention=${retention_ms}ms)"
            kafka-topics --bootstrap-server $BOOTSTRAP \
              --create --if-not-exists \
              --topic $topic \
              --partitions $partitions \
              --replication-factor $REPLICATION \
              --config retention.ms=$retention_ms \
              --config min.insync.replicas=2
          }

          # Auth & Identity
          create_topic auth-events 3
          create_topic seller-events 3

          # Commerce core
          create_topic order-events 6 2592000000        # 30 days — important
          create_topic payment-events 6 2592000000      # 30 days
          create_topic product-events 3
          create_topic cart-events 3 86400000           # 1 day (transient)
          create_topic checkout-events 6
          create_topic inventory-events 3
          create_topic shipping-events 3
          create_topic return-events 3
          create_topic dispute-events 3

          # Platform services
          create_topic notification-events 3
          create_topic analytics-events 6
          create_topic fraud-events 3
          create_topic marketplace-events 3
          create_topic fulfillment-events 3
          create_topic discount-events 3
          create_topic wishlist-events 3
          create_topic review-events 3
          create_topic media-events 3
          create_topic currency-events 3

          # Infrastructure
          create_topic dead-letter-queue 3 2592000000   # 30 days for retry

          echo ""
          echo "=== All topics created. Listing ==="
          kafka-topics --bootstrap-server $BOOTSTRAP --list
          echo ""
          echo "=== Topic details ==="
          kafka-topics --bootstrap-server $BOOTSTRAP --describe
---
# ── Database Migration Job ────────────────────────────────────────────────────
# Runs Prisma migrations before deploying auth-service.
apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: muni
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        job: prisma-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z postgres 5432; do
            echo "Waiting for PostgreSQL..."; sleep 5
          done
          echo "PostgreSQL is ready!"
      containers:
      - name: prisma-migrate
        image: 123456789012.dkr.ecr.af-south-1.amazonaws.com/muni/auth-service:latest
        command: ["npx", "prisma", "migrate", "deploy"]
        envFrom:
        - configMapRef:
            name: muni-config
        - secretRef:
            name: muni-secrets
---
# ── Elasticsearch Index Init Job ──────────────────────────────────────────────
# Creates required ES indices with mappings before search-service starts.
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-init
  namespace: muni
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        job: elasticsearch-init
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-elasticsearch
        image: curlimages/curl:8.7.1
        command:
        - sh
        - -c
        - |
          until curl -s http://elasticsearch:9200/_cluster/health | grep -q '"status":"green"\|"status":"yellow"'; do
            echo "Waiting for Elasticsearch..."; sleep 10
          done
          echo "Elasticsearch is ready!"
      containers:
      - name: es-init
        image: curlimages/curl:8.7.1
        command:
        - sh
        - -c
        - |
          ES=http://elasticsearch:9200

          echo "Creating muni-products index..."
          curl -X PUT "$ES/muni-products" -H 'Content-Type: application/json' -d '{
            "settings": {
              "number_of_shards": 3,
              "number_of_replicas": 1,
              "analysis": {
                "analyzer": {
                  "muni_analyzer": {
                    "type": "custom",
                    "tokenizer": "standard",
                    "filter": ["lowercase", "stop", "snowball"]
                  }
                }
              }
            },
            "mappings": {
              "properties": {
                "id":          { "type": "keyword" },
                "name":        { "type": "text", "analyzer": "muni_analyzer", "fields": { "keyword": { "type": "keyword" } } },
                "description": { "type": "text", "analyzer": "muni_analyzer" },
                "category":    { "type": "keyword" },
                "brand":       { "type": "keyword" },
                "sellerId":    { "type": "keyword" },
                "sellerName":  { "type": "text" },
                "price":       { "type": "double" },
                "currency":    { "type": "keyword" },
                "rating":      { "type": "float" },
                "reviewCount": { "type": "integer" },
                "stock":       { "type": "integer" },
                "inStock":     { "type": "boolean" },
                "tags":        { "type": "keyword" },
                "status":      { "type": "keyword" },
                "createdAt":   { "type": "date" },
                "updatedAt":   { "type": "date" }
              }
            }
          }'

          echo ""
          echo "Creating muni-orders index..."
          curl -X PUT "$ES/muni-orders" -H 'Content-Type: application/json' -d '{
            "settings": { "number_of_shards": 3, "number_of_replicas": 1 },
            "mappings": {
              "properties": {
                "orderId":    { "type": "keyword" },
                "userId":     { "type": "keyword" },
                "status":     { "type": "keyword" },
                "total":      { "type": "double" },
                "currency":   { "type": "keyword" },
                "createdAt":  { "type": "date" }
              }
            }
          }'

          echo ""
          echo "=== Index init complete ==="
          curl -s "$ES/_cat/indices?v"
