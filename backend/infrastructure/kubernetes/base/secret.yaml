# ─── Shared application secrets ───────────────────────────────────────────────
#
# Every value here is base64("placeholder") and MUST be replaced before any
# real deploy — by a sealed-secret, an external-secrets operator, or
# `kubectl create secret generic muni-secrets --from-literal=...`. They are
# checked in as placeholders only so `kustomize build` resolves.
#
# The token secrets additionally have a hard 32-character minimum enforced at
# startup (backend/shared/utils/token.ts). "placeholder" is 11 characters, so a
# service that boots against these values does not start with a weak secret —
# it refuses to start at all, which is the intended behaviour. Generate real
# ones with:  openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: muni-secrets
  namespace: muni
type: Opaque
data:
  DATABASE_URL: cGxhY2Vob2xkZXI=

  # ── Token signing ─────────────────────────────────────────────────────────
  #
  # JWT_ACCESS_SECRET, not JWT_SECRET. This key was previously named
  # JWT_SECRET, which nothing in the codebase reads — the shared token module
  # resolves `process.env.JWT_ACCESS_SECRET`. With the name wrong the variable
  # was simply unset in-cluster, and since the configmap sets
  # NODE_ENV=production, resolveSecret() throws rather than falling back:
  # every service that mints or verifies an access token exited at startup.
  #
  # Consumed by: auth-service, api-gateway, user-service, chat-service
  # (chat-service verifies the websocket handshake token itself — the socket
  # does not pass through the gateway, so there is no assertion to rely on).
  JWT_ACCESS_SECRET: cGxhY2Vob2xkZXI=
  JWT_REFRESH_SECRET: cGxhY2Vob2xkZXI=

  # ── Internal service identity ─────────────────────────────────────────────
  #
  # Signs the short-lived assertions the gateway mints for every authenticated
  # request, and that checkout-, order-, payment- and inventory-service verify
  # before trusting a caller. Was absent from this Secret entirely, so
  # assertInternalIdentityConfigured() called process.exit(1) on the gateway
  # and on all four money-path services in production.
  #
  # Must be byte-identical across every service that verifies it.
  INTERNAL_IDENTITY_SECRET: cGxhY2Vob2xkZXI=

  # ── PII encryption ────────────────────────────────────────────────────────
  # AES-256-GCM key for OAuth provider tokens and TOTP secrets at rest.
  # Exactly 32 bytes hex-encoded (64 hex chars): openssl rand -hex 32
  # Consumed by: auth-service, which treats it as fatal in production.
  PII_ENCRYPTION_KEY: cGxhY2Vob2xkZXI=

  # ── Datastores ────────────────────────────────────────────────────────────
  #
  # Mongo connection string, carried here rather than in the ConfigMap because
  # it embeds credentials.
  #
  # NOTE: there is no MongoDB StatefulSet in base/infra — only Postgres,
  # Elasticsearch, Kafka and Redis. order-service and chat-service both
  # require Mongo, so this must point at a managed instance (e.g. Atlas) or a
  # Mongo workload must be added before either service can become ready.
  MONGODB_URI: cGxhY2Vob2xkZXI=

  STRIPE_SECRET_KEY: cGxhY2Vob2xkZXI=
  AWS_ACCESS_KEY_ID: cGxhY2Vob2xkZXI=
  AWS_SECRET_ACCESS_KEY: cGxhY2Vob2xkZXI=
  AWS_S3_BUCKET: cGxhY2Vob2xkZXI=
  OPEN_EXCHANGE_RATES_APP_ID: cGxhY2Vob2xkZXI=
  SMTP_USER: cGxhY2Vob2xkZXI=
  SMTP_PASS: cGxhY2Vob2xkZXI=
