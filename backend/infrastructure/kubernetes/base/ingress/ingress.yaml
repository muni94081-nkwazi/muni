---
# ── cert-manager ClusterIssuer (Let's Encrypt) ───────────────────────────────
# Prerequisite: Install cert-manager first
# kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.5/cert-manager.yaml

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: devops@muni.ug
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: devops@muni.ug
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
    - http01:
        ingress:
          class: nginx
---
# ── Main API Ingress ──────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: muni-api-ingress
  namespace: muni
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://muni.ug,https://www.muni.ug,https://seller.muni.ug,https://admin.muni.ug"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,x-correlation-id"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Enable Modsecurity WAF (optional)
    # nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    # nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
spec:
  tls:
  - hosts:
    - api.muni.ug
    secretName: muni-api-tls
  rules:
  - host: api.muni.ug
    http:
      paths:
      # All API traffic → api-gateway (which routes internally)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
---
# ── Seller Center Ingress ─────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: muni-seller-ingress
  namespace: muni
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - seller.muni.ug
    secretName: muni-seller-tls
  rules:
  - host: seller.muni.ug
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: seller-center-frontend
            port:
              number: 3000
---
# ── Admin Panel Ingress ───────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: muni-admin-ingress
  namespace: muni
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Restrict admin to office IPs only
    nginx.ingress.kubernetes.io/whitelist-source-range: "0.0.0.0/0"
spec:
  tls:
  - hosts:
    - admin.muni.ug
    secretName: muni-admin-tls
  rules:
  - host: admin.muni.ug
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-panel-frontend
            port:
              number: 3001
---
# ── NGINX Ingress Controller (install via Helm if not on EKS) ────────────────
# On AWS EKS, use the AWS Load Balancer Controller instead:
# helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
#   -n kube-system \
#   --set clusterName=muni-cluster \
#   --set serviceAccount.create=false \
#   --set serviceAccount.name=aws-load-balancer-controller
#
# For non-EKS / self-managed K8s, install NGINX ingress controller:
# helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
#   --namespace ingress-nginx --create-namespace \
#   --set controller.replicaCount=3 \
#   --set controller.nodeSelector."kubernetes\.io/os"=linux \
#   --set defaultBackend.nodeSelector."kubernetes\.io/os"=linux
