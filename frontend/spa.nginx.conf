# Per-app nginx: serves one built Vite SPA as static files.
# The edge nginx (see nginx/nginx.conf) proxies to these and owns /api routing.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed bundles are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients pinned to a
    # stale bundle whose hashed assets have already been removed.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
