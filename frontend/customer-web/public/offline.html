<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#69B8D6" />
    <title>You're offline — MUNI</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 32px;
        text-align: center;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #f5f7f6;
        color: #0f172a;
      }
      .icon { font-size: 48px; }
      h1 { font-size: 20px; margin: 0; }
      p { max-width: 360px; margin: 0; color: #475569; font-size: 14px; line-height: 1.5; }
      button {
        margin-top: 8px;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        background: #69B8D6;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      a { color: #69B8D6; font-size: 13px; font-weight: 600; text-decoration: none; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>
      We couldn't reach MUNI to load this page. Your cart is saved on this device and any
      changes you made will sync automatically once you're back online.
    </p>
    <button onclick="location.reload()">Try again</button>
    <a href="/">Back to home</a>
  </body>
</html>
